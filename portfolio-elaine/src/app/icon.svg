<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#142C44"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B2AC"/>
      <stop offset="50%" stop-color="#2A8C82"/>
      <stop offset="100%" stop-color="#1C615A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2A8C82" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2A8C82" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#2A8C82" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="3" y="3" width="58" height="28" rx="15" fill="url(#glowGrad)"/>

  <!-- Stylized Medical Cross with Dynamic Care Arc -->
  <g filter="url(#softGlow)" transform="translate(32, 32)">
    <!-- Vertical bar -->
    <rect x="-4.5" y="-17" width="9" height="34" rx="4.5" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Horizontal bar -->
    <rect x="-17" y="-4.5" width="34" height="9" rx="4.5" fill="url(#tealGrad)" stroke="#FFFFFF" stroke-width="1"/>
    
    <!-- Central Pure White Spark of Safety / Detail -->
    <circle cx="0" cy="0" r="3.2" fill="#FFFFFF"/>
    
    <!-- Surrounding Care Pulse Dot -->
    <circle cx="10" cy="-10" r="2.2" fill="#5EEAD4"/>
    <circle cx="-10" cy="10" r="1.8" fill="#5EEAD4" opacity="0.8"/>
  </g>
</svg>
